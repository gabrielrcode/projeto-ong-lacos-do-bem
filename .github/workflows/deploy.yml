name: Publicar site no GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Gerar o site otimizado
        run: npm run build

      - name: Criar entrada para o endereço principal
        run: |
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=./html/index.html">
            <title>ONG Laços do Bem</title>
          </head>
          <body>
            <a href="./html/index.html">Abrir o site da ONG Laços do Bem</a>
          </body>
          </html>
          HTML

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar os arquivos gerados
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
