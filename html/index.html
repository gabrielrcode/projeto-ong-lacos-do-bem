        <template id="pagina-cadastro">

            <section class="apresentacao">
            <h2>Faça parte dessa transformação</h2>

            <p>
                Preencha o formulário e venha fazer parte da ONG Laços do Bem.
            </p>
        </section>

        <section id="cadastro">

            <div class="formulario-container">

                <h2>Cadastro de voluntário</h2>

                <p class="formulario-descricao">
                    Conte um pouco sobre você e como gostaria de contribuir.
                </p>

                <form id="formulario-cadastro">
                    <fieldset>
                        <legend>Dados Pessoais</legend>
                
                    <div class="campo">
                        <label for="nome">Nome completo</label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        aria-describedby="erro-cpf"
                        inputmode="numeric"
                        placeholder="Digite os 11 números do seu CPF"
                        maxlength="11"
                        pattern="[0-9]{11}"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        required
                    >     

                    <small id="erro-cpf" class="mensagem-erro" aria-live="polite"></small>
                    </div>

                       <div class= "campo">
                        <label for="nascimento">Data de Nascimento</label>

                        <input 
                            type="date"
                            id="nascimento"
                            name="nascimento"
                            required
                        >
                    </div>

                    </fieldset>

                    <fieldset>
                        <legend>Contato e Endereço</legend>
                    
                    <div class="campo">
                        <label for="telefone">Telefone</label>

                        <input 
                            type="tel"
                            id="telefone"
                            name="telefone"
                            aria-describedby="erro-telefone"
                            inputmode="numeric"
                            placeholder="DDD e telefone, somente números"
                            minlength="10"
                            maxlength="11"
                            pattern="[0-9]{10,11}"
                            title="Digite o DDD e o telefone com 10 ou 11 números"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            required
                        >
                        <small id="erro-telefone" class="mensagem-erro" aria-live="polite"></small>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            aria-describedby="erro-email"
                            placeholder="exemplo@email.com"
                            required
                        >
                        <small id="erro-email" class="mensagem-erro" aria-live="polite"></small>

                    </div>

                    <div class="campo">
                        <label for="cep">CEP</label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            aria-describedby="erro-cep"
                            autocomplete="postal-code"
                            inputmode="numeric"
                            placeholder="Digite os 8 números do seu CEP"
                            maxlength="8"
                            pattern="[0-9]{8}"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            required
                        >    
                        <small id="erro-cep" class="mensagem-erro" aria-live="polite"></small>
                    </div>

                    <div class="campo">
                    <label for="estado">Estado</label>

                    <select
                        id="estado"
                        name="estado"
                        autocomplete="address-level1"
                        required
                    >
                        <option value="">Selecione seu estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                    </div>
                    
                    <div class="campo">
                        <label for="cidade">Cidade</label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            autocomplete="address-level2"
                            placeholder="Digite sua cidade"
                            required
                        >    
                    </div>

                    <div class="campo">
                        <label for="endereco">Endereço</label>

                        <input  
                            type="text"
                            id="endereco"
                            name="endereco"
                            autocomplete="address-line1"
                            placeholder="Rua Florentino Tavares, Nº 361."
                            required
                        >    
                    </div>


                    </fieldset>
                     
                    <fieldset>
                        <legend>Participação</legend>
                    <div class="campo">
                        <label for="ajuda">Como você gostaria de ajudar?</label>

                        <select id="ajuda" name="ajuda" required>
                            <option value="">Selecione uma opção</option>
                            <option value="alimentos">Doação de alimentos</option>
                            <option value="educacao">Apoio educacional</option>
                            <option value="voluntariado">Trabalho voluntário</option>
                            <option value="outro">Outra forma</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="mensagem">Conte um pouco sobre você</label>

                        <textarea
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            placeholder="Escreva sua mensagem..."
                        ></textarea>

                    </div>
                </fieldset>

                    <button type="submit" class="botao-cadastro">
                        ENVIAR CADASTRO
                    </button>
                </form>
                <div id="mensagem-cadastro" hidden>
                    <h2>Obrigado pelo interesse!</h2>
                    <p>
                        Sua vontade de ajudar faz a diferença.
                        Este é um projeto acadêmico: nenhum dado foi enviado ou salvo.
                    </p>
                </div>
              
            </div>

        </section>
        </template>
